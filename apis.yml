description: >-
  Constellation Brands is a Fortune 500 producer and marketer of beer, wine, and spirits brands such as Corona, Modelo,
  Robert Mondavi, and Casa Noble. Constellation publishes a partner-oriented API catalog at dev.cbrands.com that exposes
  product, brand, and digital-asset data (bottle shots, tasting notes, hot sheets, shelf talkers, neck hangers, recipes,
  and an items product API) to distributors, retailers, and on-premise partners. Most endpoints require an API key
  issued through the developer registration process.
